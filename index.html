<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Um pedido especial...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            touch-action: manipulation;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 350px;
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 1.6rem;
            margin-bottom: 35px;
            line-height: 1.3;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }

        #btnSim {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            z-index: 10;
        }

        #btnNao {
            background-color: #dc3545;
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
            position: absolute;
            transition: all 0.1s ease-out;
        }

        .success-message {
            display: none;
            color: #d63384;
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1.4;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="card">
        <h1 id="pergunta">Karine, me dá um beijo? ❤️</h1>
        
        <div class="buttons" id="areaBotoes">
            <button id="btnSim" onclick="aceitou()">Sim</button>
            <button id="btnNao">Não</button>
        </div>

        <div id="mensagemSucesso" class="success-message">
            Ótimo, quinta as 19hrs no Texas! 🥰🍻
        </div>
    </div>

    <script>
        const btnNao = document.getElementById('btnNao');
        const pergunta = document.getElementById('pergunta');
        const mensagemSucesso = document.getElementById('mensagemSucesso');
        const areaBotoes = document.getElementById('areaBotoes');

        // Função para mover o botão "Não" para longe do toque/mouse
        function foge(e) {
            if (e) e.preventDefault(); // Evita cliques fantasmas no mobile

            const larguraJanela = window.innerWidth;
            const alturaJanela = window.innerHeight;

            // Limites para o botão não sumir da tela
            const maxX = larguraJanela - btnNao.offsetWidth - 40;
            const maxY = alturaJanela - btnNao.offsetHeight - 40;

            const aleatorioX = Math.max(20, Math.floor(Math.random() * maxX));
            const aleatorioY = Math.max(20, Math.floor(Math.random() * maxY));

            btnNao.style.position = 'fixed';
            btnNao.style.left = `${aleatorioX}px`;
            btnNao.style.top = `${aleatorioY}px`;
        }

        // Eventos para abranger tanto toque quanto mouse
        btnNao.addEventListener('touchstart', foge);
        btnNao.addEventListener('mouseover', foge);
        btnNao.addEventListener('click', foge);

        function aceitou() {
            pergunta.style.display = 'none';
            areaBotoes.style.display = 'none';
            mensagemSucesso.style.display = 'block';
        }
    </script>
</body>
</html>
