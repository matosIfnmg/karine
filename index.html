<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um pedido especial...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #btnSim {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            z-index: 10;
        }

        #btnSim:hover {
            transform: scale(1.1);
            background-color: #218838;
        }

        #btnNao {
            background-color: #dc3545;
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
            position: absolute;
            transition: all 0.15s ease-out;
        }

        /* Estilo da mensagem de sucesso */
        .success-message {
            display: none;
            color: #d63384;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="card">
        <h1 id="pergunta">Karine, me dá um beijo? ❤️</h1>
        
        <div class="buttons" id="areaBotoes">
            <button id="btnSim" onclick="aceitou()">Sim</button>
            <button id="btnNao">Não</button>
        </div>

        <div id="mensagemSucesso" class="success-message">
            Oba! Te amo! 🥰💖
        </div>
    </div>

    <script>
        const btnNao = document.getElementById('btnNao');
        const btnSim = document.getElementById('btnSim');
        const pergunta = document.getElementById('pergunta');
        const mensagemSucesso = document.getElementById('mensagemSucesso');
        const areaBotoes = document.getElementById('areaBotoes');

        // Função para mover o botão "Não" para uma posição aleatória na tela
        function foge() {
            const larguraJanela = window.innerWidth;
            const alturaJanela = window.innerHeight;

            // Gera novas coordenadas aleatórias respeitando as bordas da tela
            const maxX = larguraJanela - btnNao.offsetWidth - 50;
            const maxY = alturaJanela - btnNao.offsetHeight - 50;

            const aleatorioX = Math.max(20, Math.floor(Math.random() * maxX));
            const aleatorioY = Math.max(20, Math.floor(Math.random() * maxY));

            btnNao.style.position = 'fixed';
            btnNao.style.left = `${aleatorioX}px`;
            btnNao.style.top = `${aleatorioY}px`;
        }

        // Para computadores (mouse)
        btnNao.addEventListener('mouseover', foge);
        
        // Para celulares/tablets (toque na tela)
        btnNao.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Impede o clique direto
            foge();
        });

        // O que acontece quando ela clica no "Sim"
        function aceitou() {
            pergunta.style.display = 'none';
            areaBotoes.style.display = 'none';
            mensagemSucesso.style.display = 'block';
        }
    </script>
</body>
</html>
